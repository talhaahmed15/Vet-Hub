name: Deploy Supabase Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/create-clinic-user/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: curl -fsSL https://supabase.com/install.sh | sh

      - name: Add Supabase CLI to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      - name: Deploy create-clinic-user
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy create-clinic-user
