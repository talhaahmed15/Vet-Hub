name: clinic_management_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^10.0.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  pinput: ^6.0.1
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  pdf: ^3.11.0
  printing: ^5.13.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/logos/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Font.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"
  remove_alpha_ios: true
